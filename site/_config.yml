title: Splash
description: >
  Splash is an early statically typed language for backend and control-plane
  software, designed for machines to write and humans to trust.
baseurl: ""
url: "https://gosplash.dev"

plugins:
  - jekyll-feed

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: none

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
